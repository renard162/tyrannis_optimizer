[project]
name = "tyrannis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel Carlos Pessoa Oliveira" }
]
requires-python = ">=3.11,<=3.14"
dependencies = [
    "numpy>=2.1.3,<3.0.0",
    "scipy>=1.15.3,<2.0.0",
    "cloudpickle==3.0.0,<4.0.0",  #<===== ALTERAR PARA ">=" PARA RELEASE
]

[project.optional-dependencies]
spark = [
    "pyspark==4.1.3", #<===== ALTERAR PARA ">=" PARA RELEASE
    "pandas==2.2.3", #<===== ALTERAR PARA ">=" PARA RELEASE
    "pyarrow==19.0.1", #<===== ALTERAR PARA ">=" PARA RELEASE
]

mpi = [
    "mpi4py>=4.1.2",
]

# ray = [ #Future implementation
#     "ray>=2.58.0",
# ]

# dask = [ #Future implementation
#     "dask>=2026.8.0",
#     "distributed>=2026.8.0",
# ]

[project.scripts]
tyrannis = "tyrannis:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
# addopts = "--cov=tyrannis --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = [
    "src/tyrannis/examples/*",
]

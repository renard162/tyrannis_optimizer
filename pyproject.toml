[project]
name = "tyrannis"
version = "0.1.0a6"
description = "Flexible population-based metaheuristic optimization framework supporting diverse search spaces, parallel and distributed execution, and island-model migration."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Carlos Pessoa Oliveira" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

keywords = [
    "optimization",
    "metaheuristics",
    "global optimization",
    "black-box optimization",
    "derivative-free optimization",
    "stochastic optimization",
    "population-based optimization",
    "particle-based optimization",
    "evolutionary computation",
    "swarm intelligence",
    "estimation of distribution algorithms",
    "estimation of distribution algorithms",
    "EDA",
    "particle swarm optimization",
    "PSO",
    "differential evolution",
    "DE",
    "genetic algorithm",
    "GA",
    "CMA-ES",
    "artificial bee colony",
    "ABC",
    "ant colony optimization",
    "ACOR",
    "gravitational search algorithm",
    "GSA",
    "grey wolf optimization",
    "GWO",
    "whale optimization algorithm",
    "WOA",
    "continuous optimization",
    "integer optimization",
    "binary optimization",
    "categorical optimization",
    "ordinal optimization",
    "permutation optimization",
    "sequence optimization",
    "mixed-variable optimization",
    "parallel optimization",
    "distributed optimization",
    "island model",
    "Apache Spark",
    "MPI",
]

requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1.3,<3.0.0; python_version < '3.14'",
    "numpy>=2.3.2,<3.0.0; python_version >= '3.14'",
    "scipy>=1.15.3,<2.0.0; python_version < '3.14'",
    "scipy>=1.16.1,<2.0.0; python_version >= '3.14'",
    "cloudpickle>=3.0.0,<4.0.0; python_version < '3.14'",
    "cloudpickle>=3.1.2,<4.0.0; python_version >= '3.14'",
    "joblib>=1.4.2,<2.0.0; python_version < '3.14'",
    "joblib>=1.5.3,<2.0.0; python_version >= '3.14'",
]

[project.optional-dependencies]
cache = [
    "cachetools>=5.5.1",
]

spark = [
    "pyspark>=4.0.0",
    "pandas>=2.2.3,<3.0.0; python_version < '3.14'",
    "pandas>=2.3.3,<3.0.0; python_version >= '3.14'",
    "pyarrow>=19.0.1; python_version < '3.14'",
    "pyarrow>=22.0.0; python_version >= '3.14'",
]

mpi = [
    "mpi4py>=4.1.2",
]

# ray = [ #Future implementation
#     "ray>=2.58.0",
# ]

# dask = [ #Future implementation
#     "dask>=2026.8.0",
#     "distributed>=2026.8.0",
# ]

[project.urls]
# Homepage = "https://github.com/<user>/tyrannis"
Repository = "https://github.com/renard162/tyrannis_optimizer"
# Documentation = "https://<user>.github.io/tyrannis"
Issues = "https://github.com/renard162/tyrannis_optimizer/issues"

[project.scripts]
tyrannis-mpi = "tyrannis.cli.mpi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/mathematical",
]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
# addopts = "--import-mode=importlib --cov=tyrannis --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.basedpyright]
include = ["src", "tests", ".github/scripts"]
# Keep CI helpers visible instead of applying the default **/.* exclusion.
exclude = ["**/node_modules", "**/__pycache__", "**/__editable__.*"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
failOnWarnings = false
baselineFile = ".basedpyright/baseline.json"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
extend-ignore = ["UP040", "UP046"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
skip-magic-trailing-comma = false

name: Documentation

on:
  push:
    branches: [master]
    paths:
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare documentation
    if: >-
      github.repository == 'renard162/tyrannis_optimizer' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .github/pages

  deploy:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for artifact availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if ids="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id')"; then
              if [ "$ids" = "$ARTIFACT_ID" ]; then
                echo "Artifact is available"
                exit 0
              fi
            fi
            echo "::notice::Artifact not yet available"
          done
          echo "::error::Artifact unavailable after all attempts"
          exit 1

      - name: Skip obsolete documentation
        id: freshness
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/master
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/pages .github/workflows/pages.yml; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "::notice::Obsolete documentation: deployment skipped"
          fi

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: ${{ steps.freshness.outputs.allowed == 'true' }}
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

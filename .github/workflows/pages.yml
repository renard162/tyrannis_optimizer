name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish documentation
    if: >-
      github.repository == 'renard162/tyrannis_optimizer' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .github/pages
      # Runs after environment approval and queueing, immediately before deployment.
      - name: Skip obsolete commits
        id: freshness
        shell: bash
        run: |
          head_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Obsolete commit: deployment skipped"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: ${{ steps.freshness.outputs.allowed == 'true' }}
        id: deployment

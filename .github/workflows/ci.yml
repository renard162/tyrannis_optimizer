name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_distributions:
        description: Persist validated distributions for the calling CD workflow
        type: boolean
        default: false
    outputs:
      artifact_id:
        description: Immutable artifact produced by Package Build
        value: ${{ jobs.package-build.outputs.artifact_id }}
      manifest_sha256:
        description: SHA-256 of the manifest containing individual distribution hashes
        value: ${{ jobs.package-build.outputs.manifest_sha256 }}
      producer_attempt:
        description: Attempt that actually built the distributions (may precede a rerun)
        value: ${{ jobs.package-build.outputs.producer_attempt }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"

jobs:
  static-quality:
    name: Static Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: static-quality
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync basedpyright --pythonpath .venv/bin/python --baselinemode=lock

  core-tests:
    name: Core Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: core-tests
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run all non-optional tests
        run: uv run --no-sync pytest -m "not optional"

  cache-tests:
    name: Cache Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cache-tests
      - name: Install dependencies
        run: uv sync --locked --dev --extra cache
      - name: Run optional cache tests
        run: >-
          uv run --no-sync pytest tests/unit/core/test_space.py -m optional
          --junitxml=reports/cache.xml
      - name: Require executed tests without skips
        run: uv run --no-sync python .github/scripts/check_junit.py reports/cache.xml

  spark-tests:
    name: Spark Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: spark-tests
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: uv sync --locked --dev --extra spark
      - name: Run Spark unit and local integration tests
        env:
          PYSPARK_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          uv run --no-sync pytest
          tests/unit/backend/test_spark_parallel.py
          tests/unit/backend/test_spark_distributed.py
          tests/integration/backend/test_spark_parallel.py
          tests/integration/backend/test_spark_distributed.py
          --junitxml=reports/spark.xml
      - name: Require executed tests without skips
        run: uv run --no-sync python .github/scripts/check_junit.py reports/spark.xml

  databricks-lts-ml-tests:
    name: Databricks ${{ matrix.runtime }} LTS ML (equivalent dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: ["17.3", "18"]
    env:
      SPARK_LOCAL_IP: "127.0.0.1"
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            .github/scripts/databricks_compat.py
          cache-suffix: databricks-${{ matrix.runtime }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact CPU dependencies in an isolated environment
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          DATABRICKS_ENV="$RUNNER_TEMP/databricks-$RUNTIME"
          echo "DATABRICKS_ENV=$DATABRICKS_ENV" >> "$GITHUB_ENV"
          echo "PYSPARK_PYTHON=$DATABRICKS_ENV/bin/python" >> "$GITHUB_ENV"
          echo "PYSPARK_DRIVER_PYTHON=$DATABRICKS_ENV/bin/python" >> "$GITHUB_ENV"
          uv venv --python 3.12 "$DATABRICKS_ENV"
          "$DATABRICKS_ENV/bin/python" .github/scripts/databricks_compat.py requirements "$RUNTIME" > "$RUNNER_TEMP/databricks-requirements.txt"
          uv pip install --python "$DATABRICKS_ENV/bin/python" \
            '.[spark]' 'pytest==9.1.1' 'pytest-timeout==2.4.0' \
            --requirements "$RUNNER_TEMP/databricks-requirements.txt"
      # The helper validates versions/import provenance and uv pip check first,
      # then runs the existing tests and validates their temporary JUnit report.
      - name: Validate dependencies and run Spark tests
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: >-
          "$DATABRICKS_ENV/bin/python" .github/scripts/databricks_compat.py
          test "$RUNTIME"

  mpi-tests:
    name: MPI Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The integration tests launch three ranks even on two-core runners.
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: mpi-tests
      - name: Install OpenMPI runtime and development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openmpi-bin libopenmpi-dev
      - name: Install dependencies
        run: uv sync --locked --dev --extra mpi
      - name: Require MPI thread support
        run: |
          uv run --no-sync python - <<'PY'
          from mpi4py import MPI

          print(MPI.Get_library_version())
          if MPI.Query_thread() < MPI.THREAD_MULTIPLE:
              raise SystemExit("MPIDistributed requires MPI_THREAD_MULTIPLE")
          PY
      - name: Run real MPI integration tests
        run: >-
          uv run --no-sync pytest
          tests/integration/backend/test_mpi_parallel.py
          tests/integration/backend/test_mpi_distributed.py
          --junitxml=reports/mpi.xml
      - name: Require executed tests without skips
        run: uv run --no-sync python .github/scripts/check_junit.py reports/mpi.xml

  package-build:
    name: Package Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.record.outputs.manifest_sha256 }}
      producer_attempt: ${{ steps.record.outputs.producer_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: package-build
      - name: Validate locked base dependencies
        run: |
          uv lock --check
          uv sync --locked --no-dev
      - name: Build wheel and sdist
        run: |
          test ! -e release
          uv build --out-dir release/dist
          rm release/dist/.gitignore
      - name: Verify artifacts and metadata
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(release/dist/*.whl)
          sdists=(release/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          uvx --from twine==6.2.0 twine check --strict "${wheels[0]}" "${sdists[0]}"
      - name: Inspect contents and record source identity and SHA-256
        id: record
        run: python3 .github/scripts/release.py record
      - name: Install and smoke test both distributions independently
        shell: bash
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tyrannis-package.XXXXXX")"
          cp .github/scripts/smoke_package.py "$smoke_dir/smoke_package.py"
          wheels=("$GITHUB_WORKSPACE"/release/dist/*.whl)
          sdists=("$GITHUB_WORKSPACE"/release/dist/*.tar.gz)
          cd "$smoke_dir"
          unset PYTHONPATH
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            environment="$smoke_dir/$(basename "$artifact").venv"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I "$smoke_dir/smoke_package.py"
          done
      - name: Confirm approved bytes survived installation checks
        env:
          MANIFEST_SHA256: ${{ steps.record.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ steps.record.outputs.producer_attempt }}
        run: >-
          python3 .github/scripts/release.py verify
          --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"
      - name: Persist validated distributions for CD
        if: ${{ inputs.upload_distributions == true }}
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tyrannis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          # Keep original approved bytes for interrupted-publication recovery (CD-06).
          retention-days: 90
      - name: Report artifact identity for publication approval
        if: ${{ inputs.upload_distributions == true }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ steps.record.outputs.manifest_sha256 }}
        run: |
          {
            printf 'Validated artifacts: %s (ID %s)\n\nManifest SHA-256: `%s`\n\n' "$ARTIFACT_URL" "$ARTIFACT_ID" "$MANIFEST_SHA256"
            cat release/evidence/release.json
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - static-quality
      - core-tests
      - cache-tests
      - spark-tests
      - databricks-lts-ml-tests
      - mpi-tests
      - package-build
    if: ${{ always() }}
    steps:
      - name: Require every job and matrix combination to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq .
          printf '%s\n' "$NEEDS_JSON" | jq --exit-status \
            'length == 7 and all(.[]; .result == "success")'

name: Controlled package release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish validated artifacts to TestPyPI (irreversible)
        type: boolean
        required: true
        default: false
      confirm_version:
        description: Exact pyproject.toml version; required only for publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Independent of CI/Pages concurrency; never interrupt an in-flight upload.
concurrency:
  group: ${{ github.event_name == 'release' && format('cd-pypi-{0}-{1}', github.repository, github.ref) || format('cd-testpypi-{0}', github.repository) }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.5"

defaults:
  run:
    shell: bash

jobs:
  authorize:
    name: Authorize source before CI
    if: ${{ (github.event_name == 'workflow_dispatch' && github.repository == 'renard162/tyrannis_optimizer' && github.ref == 'refs/heads/master') || (github.event_name == 'release' && github.event.action == 'published' && github.repository == 'renard162/tyrannis_optimizer' && github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize manual master validation or TestPyPI publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          python3 .github/scripts/release.py guard
          if [ "$PUBLISH_TESTPYPI" = true ]; then
            python3 .github/scripts/release.py absent --index testpypi
          fi
      - name: Authorize official release, tag and master ancestry
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_official.py
          python3 .github/scripts/release.py absent --index pypi

  ci:
    name: Validate authorized source with full CI
    needs: [authorize]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload_distributions: true

  package-validate:
    name: Validate manual release identity and CI artifacts
    needs: [ci]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current master and exact version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: python3 .github/scripts/release.py guard
      # An absent ID must not fall back to downloading every artifact in the run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: release
      - name: Verify CI artifact identity and individual hashes
        env:
          MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.ci.outputs.producer_attempt }}
        run: >-
          python3 .github/scripts/release.py verify
          --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"

  publish-testpypi:
    name: Publish exact validated bytes to TestPyPI
    needs: [ci]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == true && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tyrannis
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: release
      # Recheck after waiting for concurrency/environment approval, before upload.
      - name: Recheck identity, hashes, version absence and manual authorization
        env:
          MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.ci.outputs.producer_attempt }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"
          python3 .github/scripts/release.py absent --index testpypi
          python3 .github/scripts/release.py guard
      - name: Publish using TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/dist/
          # Strict Twine validation ran in CI; individual hashes were rechecked above.
          verify-metadata: false
          skip-existing: false

  verify-testpypi:
    name: Verify published TestPyPI files and installation
    needs: [ci, publish-testpypi]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == true && needs.publish-testpypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: release
      - name: Verify audit evidence before retrieving published files
        env:
          MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.ci.outputs.producer_attempt }}
        run: python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"
      - name: Download exact published files and compare metadata and SHA-256
        run: python3 .github/scripts/release.py fetch --dist published
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies separately and smoke test published files
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tyrannis-testpypi.XXXXXX")"
          cp .github/scripts/smoke_package.py "$smoke_dir/smoke_package.py"
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > "$smoke_dir/dependencies.txt"
          wheels=("$GITHUB_WORKSPACE"/published/*.whl)
          sdists=("$GITHUB_WORKSPACE"/published/*.tar.gz)
          cd "$smoke_dir"
          unset PYTHONPATH
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            environment="$smoke_dir/$(basename "$artifact").venv"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple -r dependencies.txt
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple --no-deps "$artifact"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I "$smoke_dir/smoke_package.py"
          done

  publish-pypi:
    name: Publish exact validated bytes to PyPI
    needs: [ci]
    if: ${{ github.event_name == 'release' && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tyrannis
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: release
      - name: Recheck identity, hashes, version absence and live tag after approval
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.ci.outputs.producer_attempt }}
        run: |
          python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"
          python3 .github/scripts/release.py absent --index pypi
          python3 .github/scripts/release_official.py
      - name: Publish using official PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
          # Strict Twine validation ran in CI; individual hashes were rechecked above.
          verify-metadata: false
          skip-existing: false

  verify-pypi:
    name: Verify irreversible PyPI publication
    needs: [ci, publish-pypi]
    if: ${{ github.event_name == 'release' && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact_id || '0' }}
          merge-multiple: true
          path: release
      - name: Verify approved evidence and download only official PyPI files
        env:
          MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.ci.outputs.producer_attempt }}
        run: |
          python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256" --producer-attempt "$PRODUCER_ATTEMPT"
          python3 .github/scripts/release.py fetch --index pypi --dist published
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies separately and smoke test published files
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tyrannis-pypi.XXXXXX")"
          cp .github/scripts/smoke_package.py "$smoke_dir/smoke_package.py"
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > "$smoke_dir/dependencies.txt"
          wheels=("$GITHUB_WORKSPACE"/published/*.whl)
          sdists=("$GITHUB_WORKSPACE"/published/*.tar.gz)
          cd "$smoke_dir"
          unset PYTHONPATH
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            environment="$smoke_dir/$(basename "$artifact").venv"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple -r dependencies.txt
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple --no-deps "$artifact"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I "$smoke_dir/smoke_package.py"
          done
      - name: Record failed verification of a potentially irreversible publication
        if: ${{ failure() }}
        run: |
          echo '::error::PyPI upload succeeded, but post-publication verification failed. Do not republish automatically.'
          echo 'PyPI publication may be irreversible. Investigate the original artifact and published files; no automatic retry of upload.' >> "$GITHUB_STEP_SUMMARY"

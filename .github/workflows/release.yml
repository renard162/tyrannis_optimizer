name: Controlled TestPyPI release

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish validated artifacts to TestPyPI (irreversible)
        type: boolean
        required: true
        default: false
      confirm_version:
        description: Exact pyproject.toml version; required only for publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Independent of CI/Pages concurrency; never interrupt an in-flight upload.
concurrency:
  group: cd-testpypi-${{ github.repository }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.5"

defaults:
  run:
    shell: bash

jobs:
  package-build:
    name: Validate source and distributions
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'renard162/tyrannis_optimizer' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.record.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current master, exact version and successful push CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: python3 .github/scripts/release.py guard
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-package-build
      - name: Check lock and install locked base dependencies
        run: |
          uv lock --check
          uv sync --locked --no-dev
      - name: Build wheel and sdist in a fresh directory
        run: |
          test ! -e release
          uv build --out-dir release/dist
      - name: Validate metadata strictly
        run: |
          shopt -s nullglob
          wheels=(release/dist/*.whl)
          sdists=(release/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          uvx --from twine==6.2.0 twine check --strict "${wheels[0]}" "${sdists[0]}"
      - name: Inspect contents and record source identity and SHA-256
        id: record
        env:
          CI_RUN_ID: ${{ steps.guard.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.guard.outputs.ci_run_attempt }}
          CI_RUN_URL: ${{ steps.guard.outputs.ci_run_url }}
        run: python3 .github/scripts/release.py record
      - name: Install and smoke test both distributions independently
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tyrannis-release.XXXXXX")"
          cp .github/scripts/smoke_package.py "$smoke_dir/smoke_package.py"
          wheels=("$GITHUB_WORKSPACE"/release/dist/*.whl)
          sdists=("$GITHUB_WORKSPACE"/release/dist/*.tar.gz)
          cd "$smoke_dir"
          unset PYTHONPATH
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            environment="$smoke_dir/$(basename "$artifact").venv"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I "$smoke_dir/smoke_package.py"
          done
      - name: Confirm artifact bytes survived installation checks
        env:
          MANIFEST_SHA256: ${{ steps.record.outputs.manifest_sha256 }}
        run: python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256"
      - name: Upload validated distributions and audit evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tyrannis-${{ steps.guard.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Report validated release identity
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CI_RUN_URL: ${{ steps.guard.outputs.ci_run_url }}
          MANIFEST_SHA256: ${{ steps.record.outputs.manifest_sha256 }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
        run: |
          {
            printf 'TestPyPI publication requested: %s\n\n' "$PUBLISH_TESTPYPI"
            printf 'Validated artifacts: %s\n\nCI approval: %s\n\n' "$ARTIFACT_URL" "$CI_RUN_URL"
            printf 'Artifact archive SHA-256: `%s`\n\nManifest SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST" "$MANIFEST_SHA256"
            cat release/evidence/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

  publish-testpypi:
    name: Publish exact validated bytes to TestPyPI
    needs: [package-build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'renard162/tyrannis_optimizer' && github.ref == 'refs/heads/master' && inputs.publish_testpypi == true && needs.package-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tyrannis
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package-build.outputs.artifact_id }}
          merge-multiple: true
          path: release
      - name: Verify original artifact identity and hashes without rebuilding
        env:
          MANIFEST_SHA256: ${{ needs.package-build.outputs.manifest_sha256 }}
        run: python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256"
      # Recheck after waiting for environment approval and immediately before upload.
      - name: Recheck current master, CI approval and explicit version authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: python3 .github/scripts/release.py guard
      - name: Publish using TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/dist/
          skip-existing: false

  verify-testpypi:
    name: Verify published TestPyPI files and installation
    needs: [package-build, publish-testpypi]
    if: ${{ inputs.publish_testpypi == true && needs.publish-testpypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package-build.outputs.artifact_id }}
          merge-multiple: true
          path: release
      - name: Verify audit evidence before retrieving published files
        env:
          MANIFEST_SHA256: ${{ needs.package-build.outputs.manifest_sha256 }}
        run: python3 .github/scripts/release.py verify --manifest-sha256 "$MANIFEST_SHA256"
      - name: Download exact published files and compare metadata and SHA-256
        run: python3 .github/scripts/release.py fetch --dist published
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies separately and smoke test published files
        run: |
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/tyrannis-testpypi.XXXXXX")"
          cp .github/scripts/smoke_package.py "$smoke_dir/smoke_package.py"
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > "$smoke_dir/dependencies.txt"
          wheels=("$GITHUB_WORKSPACE"/published/*.whl)
          sdists=("$GITHUB_WORKSPACE"/published/*.tar.gz)
          cd "$smoke_dir"
          unset PYTHONPATH
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            environment="$smoke_dir/$(basename "$artifact").venv"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple -r dependencies.txt
            uv pip install --python "$environment/bin/python" --default-index https://pypi.org/simple --no-deps "$artifact"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I "$smoke_dir/smoke_package.py"
          done
